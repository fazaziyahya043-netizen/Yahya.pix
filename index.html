<title>Yahya-pix — Portfolio</title>

<style>
:root{--bg:#070914;--card:#ffffff0d;--bd:#ffffff1f;--tx:#f1f3ff;--mu:#a3a9cf;--a:#8b72ff;--b:#22d3ee;--c:#ff6bb5}
:root[data-theme=light]{--bg:#f4f5fc;--card:#ffffffcc;--bd:#d9dcf0;--tx:#13162b;--mu:#555b7c}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.75;overflow-x:hidden}
.aur{position:fixed;inset:0;z-index:-1;overflow:hidden}.aur i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--a);top:-20%;inset-inline-start:-15%}.aur i:nth-child(2){background:var(--b);bottom:-25%;inset-inline-end:-15%;animation-delay:-6s}.aur i:nth-child(3){background:var(--c);top:35%;inset-inline-start:35%;width:30vmax;height:30vmax;opacity:.15;animation-delay:-11s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.w{max-width:1000px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:6px;padding-block:10px;overflow-x:auto}
nav a{color:var(--mu);text-decoration:none;padding:5px 12px;border-radius:99px;font-size:.9rem;white-space:nowrap}nav a:hover{color:var(--tx);background:var(--card)}
nav .sp{flex:1}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
.hero{padding:50px 14px 20px;overflow:clip;margin:0}
.tag{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-size:.88rem;margin:3px 0;margin-inline-end:6px}
h1{font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.1;margin:10px 0;font-weight:900}
.g{background:linear-gradient(90deg,var(--a),var(--b),var(--c));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}@keyframes sh{to{background-position:200%}}
.role{font-size:1.25rem;color:var(--mu);min-height:2em}.role b{color:var(--b)}
.st{margin-top:16px;padding:14px 18px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;box-shadow:0 14px 40px -12px var(--a)}.st small{display:block;font-weight:400;opacity:.92}
.pw{position:relative;width:min(340px,80%);margin:auto}
.pw:before{content:"";position:absolute;inset:-10px;border-radius:44px;background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));filter:blur(18px);opacity:.75;animation:rt 8s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.pw img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:38px;border:3px solid #ffffff55;display:block;transition:transform .5s}.pw:hover img{transform:scale(1.03) rotate(-1deg)}
.chip{position:absolute;z-index:2;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:6px 12px;font-size:.85rem;font-weight:700;box-shadow:0 10px 30px #0006;animation:bb 4s ease-in-out infinite alternate}
.chip:nth-of-type(1){top:8%;inset-inline-start:-4%}.chip:nth-of-type(2){bottom:20%;inset-inline-end:-4%;animation-delay:-1.5s}.chip:nth-of-type(3){bottom:-3%;inset-inline-start:6%;animation-delay:-3s}@keyframes bb{to{transform:translateY(-10px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.stats div{text-align:center;padding:16px 6px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}.stats b{display:block;font-size:1.9rem;font-weight:900}.stats span{color:var(--mu);font-size:.85rem}
h2{font-size:1.7rem;margin:60px 0 18px;font-weight:900}h2:after{content:"";display:block;width:56px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b));margin-top:6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;backdrop-filter:blur(8px);transition:.3s}.c:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 18px 40px -20px var(--a)}
.c h3{margin:0 0 6px;font-size:1.08rem}.c p{margin:0;color:var(--mu);font-size:.94rem}.ic{font-size:2rem}
.bar{margin:14px 0}.bar>div{display:flex;justify-content:space-between;font-size:.93rem}.bar i{display:block;height:10px;border-radius:10px;background:var(--bd);overflow:hidden;margin-top:5px}.bar b{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b));width:0;transition:width 1.4s}
.cert img{width:100%;border-radius:14px;cursor:zoom-in;border:1px solid var(--bd);margin-top:10px}
.tl{border-inline-start:3px solid var(--bd);padding-inline-start:20px}.tl .c{margin-bottom:14px;position:relative}.tl .c:before{content:"";position:absolute;inset-inline-start:-30px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--b);box-shadow:0 0 0 5px var(--bd)}
.rv{opacity:0;transform:translateY(24px);transition:.8s}.rv.on{opacity:1;transform:none}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:14px;z-index:99}#lb img{max-width:100%;max-height:100%;border-radius:10px}
footer{text-align:center;color:var(--mu);padding:50px 0 30px;font-size:.9rem}
</style></head><body>
